<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>audio-minutes</title>
    <style>
      body { font: 13px -apple-system, system-ui, sans-serif; margin: 0; padding: 12px; width: 280px; color: #222; }
      h1 { font-size: 14px; margin: 0 0 8px; }
      dl { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; margin: 0 0 12px; }
      dt { color: #666; }
      .status { font-weight: 600; }
      .status.ok { color: #2e7d32; }
      .status.warn { color: #ef6c00; }
      .status.err { color: #c62828; }
      button { width: 100%; padding: 8px; font-size: 13px; border-radius: 6px; border: 1px solid #999; background: #fff; cursor: pointer; }
      button:disabled { color: #999; cursor: default; }
      button.primary { background: #2b6cb0; color: #fff; border-color: #2b6cb0; }
      .note { font-size: 12px; color: #666; margin-top: 8px; }
    </style>
  </head>
  <body>
    <h1>audio-minutes Meet 連携</h1>
    <dl>
      <dt>GUI 接続</dt><dd id="connection" class="status">確認中</dd>
      <dt>このタブ</dt><dd id="tab" class="status">確認中</dd>
      <dt>録音</dt><dd id="capture" class="status">停止中</dd>
    </dl>
    <button id="start" class="primary" disabled>Chrome で録音を許可</button>
    <button id="stop" hidden>録音を停止</button>
    <p class="note" id="note">録音はこのタブの音声だけを取得し、audio-minutes GUI へローカルで渡します。外部へ送信しません。</p>
    <script type="module" src="popup.js"></script>
  </body>
</html>
