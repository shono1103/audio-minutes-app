[project]
name = "minutes-worker"
version = "0.1.0"
description = "audio-minutes の議事録ワーカー。Claude CLI (個人 subscription) による生成と Claude 認証アダプター"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "audio-minutes-contracts",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "pydantic>=2.9,<3",
  "jsonschema>=4.23,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "httpx>=0.27", "ruff>=0.6"]

[project.scripts]
minutes-worker = "minutes_worker.__main__:main"

[tool.uv.sources]
audio-minutes-contracts = { path = "../../packages/python/audio_minutes_contracts", editable = true }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/minutes_worker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: Docker の PostgreSQL を使う統合試験"]

[tool.ruff]
line-length = 110
target-version = "py312"
