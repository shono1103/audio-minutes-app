[project]
name = "transcription-worker"
version = "0.1.0"
description = "audio-minutes の文字起こしワーカー。faster-whisper CPU / whisper.cpp (Vulkan) アダプターと共通戦略"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "audio-minutes-contracts",
  "faster-whisper==1.2.1",
  "numpy>=1.26,<3",
  "huggingface-hub>=0.24",
  "psycopg[binary]>=3.2,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.6"]

[project.scripts]
transcription-worker = "transcription_worker.runner:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/transcription_worker"]

[tool.uv.sources]
audio-minutes-contracts = { path = "../../packages/python/audio_minutes_contracts", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "slow: 実モデルを使う (既定では除外)",
  "integration: Docker 上の PostgreSQL を使う",
]
addopts = "-m 'not slow'"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]
