<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ title }} - audio-minutes</title>
<style>
  :root { color-scheme: light dark; font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif; }
  body { max-width: 32rem; margin: 3rem auto; padding: 0 1rem; line-height: 1.6; }
  h1 { font-size: 1.4rem; }
  label { display: block; margin-top: 1rem; font-weight: 600; }
  input[type=text], input[type=email], input[type=password] { width: 100%; padding: .5rem; font-size: 1rem; box-sizing: border-box; }
  button { margin-top: 1.2rem; padding: .6rem 1.2rem; font-size: 1rem; cursor: pointer; }
  .error { color: #b00020; border: 1px solid #b00020; padding: .6rem; border-radius: .3rem; }
  .notice { border: 1px solid #888; padding: .6rem; border-radius: .3rem; }
  code.recovery { display: inline-block; margin: .2rem .4rem; padding: .2rem .4rem; border: 1px solid #888; border-radius: .2rem; }
  .muted { color: #666; font-size: .9rem; }
</style>
</head>
<body>
<h1>{{ title }}</h1>
{% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
{% block content %}{% endblock %}
<p class="muted">audio-minutes minutes-api {{ version }}</p>
</body>
</html>
