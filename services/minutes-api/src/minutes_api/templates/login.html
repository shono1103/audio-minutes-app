{% extends "base.html" %}
{% block content %}
<form method="post" action="/auth/login">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
  <input type="hidden" name="next" value="{{ next or '' }}">
  <label for="email">メールアドレス</label>
  <input id="email" name="email" type="email" required autocomplete="username webauthn">
  <label for="password">パスワード</label>
  <input id="password" name="password" type="password" autocomplete="current-password">
  <details><summary class="muted">リカバリーコードでログイン</summary>
    <label for="recovery_code">リカバリーコード</label>
    <input id="recovery_code" name="recovery_code" type="text" autocomplete="off">
  </details>
  <button type="submit">ログイン</button>
  <button type="button" id="passkey-login">パスキーでログイン</button>
  <span id="passkey-status" class="muted"></span>
</form>
<script>
const b64u = {
  enc: (buf) => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''),
  dec: (s) => Uint8Array.from(atob(s.replace(/-/g,'+').replace(/_/g,'/').padEnd(s.length + (4 - s.length % 4) % 4, '=')), c => c.charCodeAt(0)),
};
document.getElementById('passkey-login').addEventListener('click', async () => {
  const status = document.getElementById('passkey-status');
  try {
    const optResp = await fetch('/auth/webauthn/login/options', {method:'POST', headers:{'X-CSRF-Token': {{ csrf_token|tojson }}}});
    const options = await optResp.json();
    options.challenge = b64u.dec(options.challenge);
    (options.allowCredentials || []).forEach(c => c.id = b64u.dec(c.id));
    const cred = await navigator.credentials.get({publicKey: options});
    const body = {
      id: cred.id, rawId: b64u.enc(cred.rawId), type: cred.type,
      response: { clientDataJSON: b64u.enc(cred.response.clientDataJSON), authenticatorData: b64u.enc(cred.response.authenticatorData), signature: b64u.enc(cred.response.signature), userHandle: cred.response.userHandle ? b64u.enc(cred.response.userHandle) : null },
      clientExtensionResults: cred.getClientExtensionResults(),
      next: {{ (next or '')|tojson }},
    };
    const verify = await fetch('/auth/webauthn/login/verify', {method:'POST', headers:{'Content-Type':'application/json','X-CSRF-Token': {{ csrf_token|tojson }}}, body: JSON.stringify(body)});
    if (verify.ok) { const data = await verify.json(); window.location.href = data.next || '/auth/login'; }
    else status.textContent = 'パスキーでのログインに失敗しました';
  } catch (e) { status.textContent = 'パスキーでのログインを中止しました'; }
});
</script>
{% endblock %}
